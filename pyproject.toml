[project]
name = "batterygemma"
version = "0.1.0"
description = "Literature pipeline and datasets to fine-tune Gemma 4 E2B as a Li-ion battery materials expert"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "litellm>=1.40",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
parse = ["docling>=2.0", "lxml>=5.2"]
dedupe = ["datasketch>=1.6"]
train = ["unsloth", "trl", "datasets", "psutil>=6.0"]
dev = ["pytest>=8.2", "respx>=0.21"]

[project.scripts]
bg = "batterygemma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batterygemma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
