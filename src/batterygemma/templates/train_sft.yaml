# SFT LoRA config. Trained via Unsloth's MLX backend (Apple Silicon) - see
# src/batterygemma/train/sft.py module docstring for what is and isn't supported on this backend.
model_name: unsloth/gemma-4-E2B-it-UD-MLX-4bit   # Unsloth's own dynamic ("UD") 4-bit quant, pre-converted
                                                  # to MLX - see configs/train_cpt.yaml for why this replaced
                                                  # both the full-precision unsloth/gemma-4-E2B-it (memory
                                                  # spike during runtime quantization) and the GGUF variant
                                                  # (no MLX load path in this Unsloth version).
max_seq_length: 2048
chat_template: gemma-4   # plain (non-thinking) template - see module docstring for why
text_only: true  # Gemma 4 E2B is natively multimodal; this forces the plain mlx-lm text path instead of
                 # the VLM path - set to false only when training against an `include_images` export.

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true

# Passed to unsloth.MLXTrainingConfig. assistant_only_loss is currently forced to False in train/sft.py:
# the built-in gemma-4 template lacks the {% generation %} markers this backend needs for response-only
# masking (see that module's docstring) - so training is over the full rendered sequence for now.
training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  max_steps: 40  # PoC smoke run, not full training
  learning_rate: 0.0002
  warmup_steps: 10
  logging_steps: 1
  save_steps: 0
