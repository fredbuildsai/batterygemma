# Teacher-LLM deployments and task routes.
# Model ids use LiteLLM's "<provider>/<model>" convention. Limits are starting points: check your
# workspace limits in each provider's console and edit them. The router also backs off automatically on
# 429s, so an over-estimate costs retries, not failures. A deployment whose api_key_env is unset is skipped.
#
#   rate_group   deployments drawing on one provider budget (e.g. a Mistral workspace) share rpm/rpd windows
#                and rate-limit cooldowns
#   rpm/tpm/rpd  requests per minute / tokens per minute / requests per day (null = unlimited); applied per group
#   tier         free | paid (paid only used when BG_ALLOW_PAID=true and under the daily budget)
#   family       model family, used to keep judge != generator family
#   tags         capabilities: strong, fast, judge, json
#   cost_per_mtok_in/out  USD per million tokens (paid tier budget accounting)
#   api_base     override the provider's default endpoint
#   extra_body   passed through verbatim to the request (e.g. reasoning/thinking controls)
#   min_max_tokens  floor on the requested max_tokens; useful for reasoning models that spend budget thinking

deployments:
  # --- NVIDIA (integrate.api.nvidia.com), free tier: primary provider while Mistral (below) is broken ---
  - name: nvidia-deepseek
    model: nvidia_nim/deepseek-ai/deepseek-v4-flash-0731
    api_key_env: NVIDIA_NIM_API_KEY
    api_base: https://integrate.api.nvidia.com/v1
    tier: free
    family: deepseek
    rate_group: nvidia-workspace  # conservative: NVIDIA's free-tier quota may be shared across models on the key
    rpm: 40
    min_max_tokens: 8192  # thinking can consume most of a small budget before the answer is written
    extra_body:
      chat_template_kwargs: {thinking: true, reasoning_effort: low}  # high effort took ~80s even on trivial prompts
    tags: [strong, json, judge]

  - name: nim-llama
    model: nvidia_nim/meta/llama-3.3-70b-instruct
    api_key_env: NVIDIA_NIM_API_KEY
    tier: free
    family: llama
    rate_group: nvidia-workspace
    rpm: 40
    tags: [fast, json]

  # --- Mistral, free Experiment tier: every model shares one workspace budget ------------------------
  - name: mistral-small
    model: mistral/mistral-small-latest
    api_key_env: MISTRAL_API_KEY
    tier: free
    family: mistral
    rate_group: mistral-workspace
    rpm: 20
    tags: [fast, json]

  - name: mistral-medium
    model: mistral/mistral-medium-latest
    api_key_env: MISTRAL_API_KEY
    tier: free
    family: mistral
    rate_group: mistral-workspace
    rpm: 20
    tags: [strong, json]

  - name: magistral-medium
    model: mistral/magistral-medium-latest
    api_key_env: MISTRAL_API_KEY
    tier: free
    family: mistral
    rate_group: mistral-workspace
    rpm: 20
    tags: [strong, judge]

  # Returned 403 tier_not_allowed on the Experiment tier; kept for a paid workspace, not used in routes.
  - name: mistral-large
    model: mistral/mistral-large-latest
    api_key_env: MISTRAL_API_KEY
    tier: free
    family: mistral
    rate_group: mistral-workspace
    rpm: 20
    tags: [strong, json, judge]

  # --- Other providers (defined but not in routes yet; add a key and put them in a route to use) ----
  - name: gemini-flash
    model: gemini/gemini-2.5-flash
    api_key_env: GEMINI_API_KEY
    tier: free
    family: gemini
    rpm: 10
    rpd: 250
    tags: [fast, strong, json, judge]

  - name: nim-llama
    model: nvidia_nim/meta/llama-3.3-70b-instruct
    api_key_env: NVIDIA_NIM_API_KEY
    tier: free
    family: llama
    rpm: 40
    tags: [fast, json]

  - name: groq-llama
    model: groq/llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    tier: free
    family: llama
    rpm: 30
    rpd: 1000
    tags: [fast, json]

  - name: cerebras-qwen
    model: cerebras/qwen-3-32b
    api_key_env: CEREBRAS_API_KEY
    tier: free
    family: qwen
    rpm: 30
    rpd: 14400
    tags: [fast, json, judge]

  - name: claude-sonnet
    model: anthropic/claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    tier: paid
    family: claude
    rpm: 50
    cost_per_mtok_in: 3.0
    cost_per_mtok_out: 15.0
    tags: [strong, json, judge]

# Ordered preference per task. The router tries deployments in order, skipping any that are disabled,
# cooling down, over quota, or excluded for a judge call. NVIDIA (nvidia-deepseek) is listed first while
# Mistral's free tier is returning 429s on every request; Mistral entries stay in each chain so it resumes
# automatically once that's resolved. The judge route lists nim-llama (a different family from
# nvidia-deepseek, both on the same NVIDIA key) so judging stays cross-family even with only NVIDIA working.
routes:
  screen:    [nvidia-deepseek, mistral-small, mistral-medium]
  extract:   [nvidia-deepseek, mistral-small, mistral-medium]
  qa:        [nvidia-deepseek, mistral-medium, mistral-small]
  negatives: [nvidia-deepseek, mistral-medium, mistral-small]
  ideation:  [nvidia-deepseek, mistral-medium, magistral-medium]
  judge:     [magistral-medium, mistral-medium, nim-llama]

cooldown:
  rate_limit_seconds: 60        # 429 per-minute limits (shared by a rate_group)
  daily_quota_seconds: 86400    # provider says daily quota exhausted
  error_seconds: 30             # transient 5xx / timeouts (per deployment)
max_attempts_per_call: 6
